<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEKELI - Créer un compte</title>
  <style>
    :root {
      --bleu-kekeli: #003366;
      --jaune-kekeli: #FFCC00;
      --bg-light: #F4F7F9;
      --text-dark: #1E293B;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bleu-kekeli) 0%, #001A33 100%);
      min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center;
      padding: 30px 20px;
    }
    .signup-card {
      background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%; max-width: 480px; border-top: 6px solid var(--jaune-kekeli);
    }
    .header-signup { text-align: center; margin-bottom: 25px; }
    .logo-title { font-size: 28px; font-weight: 800; color: var(--bleu-kekeli); letter-spacing: 1px; }
    .logo-title span { color: var(--jaune-kekeli); }
    .subtitle { font-size: 14px; color: #64748B; margin-top: 5px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: bold; color: var(--text-dark); margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 11px; border: 2px solid #E2E8F0; border-radius: 8px; font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: var(--bleu-kekeli); }
    .mascot-selection { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; }
    .mascot-option {
      flex: 1; text-align: center; background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 8px;
      padding: 8px; cursor: pointer; font-size: 22px; transition: all 0.2s;
    }
    .mascot-option:hover, .mascot-option.selected { border-color: var(--jaune-kekeli); background-color: #FFF9E6; }
    .champ-eleve { display: none; }
    .btn-signup {
      width: 100%; padding: 14px; background-color: var(--jaune-kekeli); color: var(--bleu-kekeli);
      border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
      margin-top: 15px; transition: background 0.2s;
    }
    .btn-signup:hover { background-color: #e6b800; }
    .btn-signup:disabled { opacity: 0.6; cursor: default; }
    .footer-links { margin-top: 20px; font-size: 13px; text-align: center; color: #64748B; }
    .footer-links a { color: var(--bleu-kekeli); text-decoration: none; font-weight: 600; }
    .message-erreur { color: #c0392b; font-size: 13px; margin-bottom: 10px; text-align: center; }
  </style>
</head>
<body>

  <div class="signup-card">
    <div class="header-signup">
      <div class="logo-title">☀️ KEKELI<span>.</span></div>
      <div class="subtitle">Rejoignez l'aventure de la connaissance</div>
    </div>

    <form id="formInscription">
      <div class="form-group">
        <label>Type de compte</label>
        <select id="role" required>
          <option value="eleve">👧 Compte Élève</option>
          <option value="enseignant">👨‍🏫 Compte Enseignant</option>
          <option value="parent">👨‍👩‍👧 Compte Parent</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" id="prenom" placeholder="Ex: Biodun" required>
        </div>
        <div class="form-group">
          <label>Nom</label>
          <input type="text" id="nom" placeholder="Ex: Dossou" required>
        </div>
      </div>

      <div class="form-group champ-eleve">
        <label>Classe</label>
        <select id="classe">
          <option value="">Chargement des classes...</option>
        </select>
      </div>

      <div class="form-group champ-eleve">
        <label>Choisis ta mascotte d'apprentissage :</label>
        <div class="mascot-selection" id="mascottes">
          <div class="mascot-option selected" data-valeur="🦁" title="Lion">🦁</div>
          <div class="mascot-option" data-valeur="🦅" title="Aigle">🦅</div>
          <div class="mascot-option" data-valeur="🐘" title="Éléphant">🐘</div>
          <div class="mascot-option" data-valeur="🐆" title="Panthère">🐆</div>
        </div>
      </div>

      <div class="form-group">
        <label id="labelIdentifiant">Nom d'utilisateur ou e-mail</label>
        <input type="text" id="identifiant" placeholder="Ex: biodun.cm2" required>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="motDePasse" placeholder="•••••••• (6 caractères min.)" minlength="6" required>
      </div>

      <p class="message-erreur" id="messageErreur"></p>

      <button type="submit" class="btn-signup" id="btnInscription">Créer mon compte ☀️</button>
    </form>

    <div class="footer-links">
      Vous avez déjà un compte ? <a href="login.html">Se connecter</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script>const RACINE_SITE = "../";</script>
  <script src="../js/auth-roles.js"></script>
  <script src="../js/pages/inscription.js"></script>
</body>
</html>
