<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEKELI - Mon espace</title>
  <style>
    :root {
      --bleu-kekeli: #003366; --jaune-kekeli: #FFCC00;
      --azovi: #2ECC71; --devi: #3498DB; --ogan: #E67E22; --axosu: #9B59B6;
      --bg-light: #F4F7F9; --text-dark: #1E293B;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-light); margin: 0; color: var(--text-dark); }
    header { background-color: var(--bleu-kekeli); color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .logo { font-size: 22px; font-weight: 800; color: var(--jaune-kekeli); }
    .zone-droite { display: flex; align-items: center; gap: 12px; }
    .user-badge { background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 20px; font-size: 14px; }
    .btn-deconnexion { background: none; border: 1px solid rgba(255,255,255,0.5); color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .welcome-container { max-width: 900px; margin: 40px auto; padding: 0 20px; text-align: center; }
    .welcome-card { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 6px solid var(--jaune-kekeli); margin-bottom: 30px; }
    .mascot-avatar { font-size: 60px; background: #FFF9E6; width: 100px; height: 100px; line-height: 100px; border-radius: 50%; margin: 0 auto 15px; border: 3px solid var(--jaune-kekeli); }
    .welcome-card h1 { color: var(--bleu-kekeli); font-size: 30px; margin-bottom: 10px; }
    .welcome-card p { font-size: 16px; color: #64748B; margin-bottom: 25px; }
    .streak-info { display: inline-flex; align-items: center; gap: 10px; background: #F1F5F9; padding: 8px 18px; border-radius: 30px; font-weight: bold; color: var(--ogan); }
    .section-title { text-align: left; font-size: 20px; color: var(--bleu-kekeli); margin-bottom: 20px; }
    .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .action-card { background: white; border-radius: 12px; padding: 25px; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 2px solid transparent; transition: all 0.2s; text-decoration: none; color: inherit; }
    .action-card:hover { border-color: var(--bleu-kekeli); transform: translateY(-3px); }
    .action-icon { font-size: 32px; margin-bottom: 12px; }
    .action-title { font-size: 18px; font-weight: bold; color: var(--bleu-kekeli); margin-bottom: 6px; }
    .action-desc { font-size: 14px; color: #64748B; line-height: 1.4; }
    .btn-start { display: block; width: 100%; padding: 14px; background: var(--bleu-kekeli); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 15px; text-align: center; }
    .chargement { padding: 60px; text-align: center; color: #64748B; }
  </style>
</head>
<body>

  <header>
    <div class="logo">☀️ KEKELI</div>
    <div class="zone-droite">
      <div class="user-badge" id="badgeUtilisateur">🟢 Connexion...</div>
      <button class="btn-deconnexion" onclick="deconnecterUtilisateur()">Déconnexion</button>
    </div>
  </header>

  <div id="contenu" class="chargement">Chargement de ton espace...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script>const RACINE_SITE = "../../";</script>
  <script src="../../js/auth-roles.js"></script>
  <script src="../../js/pages/eleve-tableau-de-bord.js"></script>
</body>
</html>
