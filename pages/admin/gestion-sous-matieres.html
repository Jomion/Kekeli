<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des sous-matières - KEKELI</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

  <header class="admin-header">
    <h1>Sous-matières</h1>
    <a href="dashboard.html" class="btn-deconnexion">← Retour</a>
  </header>

  <main class="admin-contenu">

    <form id="formAjout" class="admin-form admin-form-inline">
      <label for="classe">Classe</label>
      <select id="classe" required>
        <option value="">-- Choisir une classe --</option>
      </select>

      <label for="matiere">Matière</label>
      <select id="matiere" required>
        <option value="">-- Choisir d'abord une classe --</option>
      </select>

      <label for="nom">Nom de la sous-matière</label>
      <input type="text" id="nom" placeholder="Ex: Grammaire" required>

      <label for="ordre">Ordre d'affichage</label>
      <input type="number" id="ordre" placeholder="Ex: 1" required>

      <button type="submit">➕ Ajouter</button>
      <p id="messageForm" class="message-erreur"></p>
    </form>

    <div class="admin-filtre">
      <label for="filtreClasse">Filtrer par classe :</label>
      <select id="filtreClasse">
        <option value="">Toutes les classes</option>
      </select>
    </div>

    <div id="listeSousMatieres" class="admin-liste">Chargement...</div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/admin-sous-matieres.js"></script>

</body>
</html>
