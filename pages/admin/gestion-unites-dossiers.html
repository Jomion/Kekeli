<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion Unités/Dossiers - KEKELI</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

  <header class="admin-header">
    <h1>Unités / Dossiers</h1>
    <a href="dashboard.html" class="btn-deconnexion">← Retour</a>
  </header>

  <main class="admin-contenu">

    <form id="formAjout" class="admin-form admin-form-inline">
      <label for="classe">Classe(s) — Ctrl/Cmd + clic pour plusieurs</label>
      <select id="classe" multiple size="6" required></select>

      <label for="matiere">Matière</label>
      <select id="matiere" required>
        <option value="">-- Choisir d'abord une/des classe(s) --</option>
      </select>

      <label for="sousMatiere">Sous-matière (si applicable)</label>
      <select id="sousMatiere">
        <option value="">-- Aucune / non applicable --</option>
      </select>

      <label for="type">Type</label>
      <select id="type" required>
        <option value="unite">Unité</option>
        <option value="dossier">Dossier</option>
      </select>

      <label for="semaine">Semaine (si applicable, pour les Unités)</label>
      <select id="semaine">
        <option value="">-- Non applicable --</option>
        <option value="1ère semaine">1ère semaine</option>
        <option value="2e semaine">2e semaine</option>
      </select>

      <label for="nom">Nom</label>
      <input type="text" id="nom" placeholder="Ex: Unité 1 ou Dossier 2" required>
      <label for="ordre">Ordre d'affichage</label>
      <input type="number" id="ordre" placeholder="Ex: 1" required>

      <button type="submit">➕ Ajouter</button>
      <p id="messageForm" class="message-erreur"></p>
    </form>

    <div class="admin-filtre">
      <label for="filtreClasse">Filtrer par classe :</label>
      <select id="filtreClasse">
        <option value="">Toutes les classes</option>
      </select>

      <label for="filtreMatiere">Filtrer par matière :</label>
      <select id="filtreMatiere">
        <option value="">Toutes les matières</option>
      </select>
    </div>
    <div id="listeUnitesDossiers" class="admin-liste">Chargement...</div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/admin-unites-dossiers.js?v=2"></script>
</body>
</html>
