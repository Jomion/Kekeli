<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des classes - KEKELI</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

  <header class="admin-header">
    <h1>Classes</h1>
    <a href="dashboard.html" class="btn-deconnexion">← Retour</a>
  </header>

  <main class="admin-contenu">

    <form id="formAjout" class="admin-form admin-form-inline">
      <label for="nom">Nom de la classe</label>
      <input type="text" id="nom" placeholder="Ex: CM2" required>

      <label for="ordre">Ordre d'affichage</label>
      <input type="number" id="ordre" placeholder="Ex: 6" required>

      <button type="submit">➕ Ajouter</button>
      <p id="messageForm" class="message-erreur"></p>
    </form>

    <div id="listeClasses" class="admin-liste">Chargement...</div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/admin-classes.js"></script>

</body>
</html>
