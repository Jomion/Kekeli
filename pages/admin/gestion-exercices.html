<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des exercices - KEKELI</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

  <header class="admin-header">
    <h1>Exercices</h1>
    <a href="dashboard.html" class="btn-deconnexion">← Retour</a>
  </header>

  <main class="admin-contenu">

    <form id="formAjout" class="admin-form admin-form-inline">
      <label for="classe">Classe</label>
      <select id="classe" required>
        <option value="">-- Choisir une classe --</option>
      </select>

      <label for="matiere">Matière</label>
      <select id="matiere" required>
        <option value="">-- Choisir d'abord une classe --</option>
      </select>

      <label for="sousMatiere">Sous-matière (si applicable)</label>
      <select id="sousMatiere">
        <option value="">-- Aucune --</option>
      </select>

      <label for="uniteDossier">Unité / Dossier (si applicable)</label>
      <select id="uniteDossier">
        <option value="">-- Aucun --</option>
      </select>

      <label for="sa">SA (si applicable)</label>
      <select id="sa">
        <option value="">-- Aucune --</option>
      </select>

      <label for="seance">Séance</label>
      <select id="seance">
        <option value="">-- Aucune / exercice indépendant --</option>
      </select>

      <label for="titre">Titre (facultatif)</label>
      <input type="text" id="titre" placeholder="Ex: Exercice 1">

      <label for="enonce">Énoncé</label>
      <textarea id="enonce" rows="3" required></textarea>

      <label for="type">Type</label>
      <select id="type" required>
        <option value="qcm">QCM</option>
        <option value="vrai_faux">Vrai/Faux</option>
        <option value="reponse_saisie">Réponse à saisir</option>
        <option value="calcul">Calcul</option>
        <option value="texte_a_completer">Texte à compléter</option>
        <option value="association">Association</option>
        <option value="classement">Classement</option>
      </select>

      <label for="reponsesProposees">Réponses proposées (une par ligne, pour QCM)</label>
      <textarea id="reponsesProposees" rows="3" placeholder="Ex:&#10;20&#10;30&#10;35"></textarea>

      <label for="bonneReponse">Bonne réponse</label>
      <input type="text" id="bonneReponse" placeholder="Ex: 30 ou B">

      <label for="correction">Correction</label>
      <textarea id="correction" rows="3"></textarea>

      <label for="explication">Explication pédagogique</label>
      <textarea id="explication" rows="3"></textarea>

      <label for="bareme">Barème</label>
      <input type="number" id="bareme" step="0.5" placeholder="Ex: 2">

      <label for="difficulte">Difficulté</label>
      <select id="difficulte">
        <option value="facile">Facile</option>
        <option value="moyen">Moyen</option>
        <option value="difficile">Difficile</option>
      </select>

      <label for="statut">Statut</label>
      <select id="statut">
        <option value="brouillon">Brouillon</option>
        <option value="publie">Publié</option>
      </select>

      <label for="ordre">Ordre d'affichage</label>
      <input type="number" id="ordre" placeholder="Ex: 1" required>

      <button type="submit">➕ Ajouter</button>
      <p id="messageForm" class="message-erreur"></p>
    </form>

    <div class="admin-filtre">
      <label for="filtreClasse">Filtrer par classe :</label>
      <select id="filtreClasse">
        <option value="">Toutes les classes</option>
      </select>
    </div>

    <div id="listeExercices" class="admin-liste">Chargement...</div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/admin-exercices.js"></script>

</body>
</html>
