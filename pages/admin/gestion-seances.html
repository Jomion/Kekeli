<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des séances - KEKELI</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/editeur-blocs.css">
</head>
<body>

  <header class="admin-header">
    <h1>Séances</h1>
    <a href="dashboard.html" class="btn-deconnexion">← Retour</a>
  </header>

  <main class="admin-contenu">

    <form id="formAjout" class="admin-form admin-form-inline">
      <label for="classe">Classe(s) — Ctrl/Cmd + clic pour plusieurs</label>
      <select id="classe" multiple size="6" required></select>

      <label for="matiere">Matière</label>
      <div style="display:flex;gap:8px;">
        <select id="matiere" required style="flex:1;">
          <option value="">-- Choisir d'abord une/des classe(s) --</option>
        </select>
        <button type="button" id="btnCreerMatiere" class="btn-secondaire">➕ Créer</button>
      </div>

      <label for="sousMatiere">Sous-matière (si applicable)</label>
      <div style="display:flex;gap:8px;">
        <select id="sousMatiere" style="flex:1;">
          <option value="">-- Aucune / non applicable --</option>
        </select>
        <button type="button" id="btnCreerSousMatiere" class="btn-secondaire">➕ Créer</button>
      </div>

      <label for="uniteDossier">Unité / Dossier (si applicable)</label>
      <div style="display:flex;gap:8px;">
        <select id="uniteDossier" style="flex:1;">
          <option value="">-- Aucun --</option>
        </select>
        <button type="button" id="btnCreerUD" class="btn-secondaire">➕ Créer</button>
      </div>

      <label for="sa">SA (si applicable)</label>
      <div style="display:flex;gap:8px;">
        <select id="sa" style="flex:1;">
          <option value="">-- Aucune / rattacher directement --</option>
        </select>
        <button type="button" id="btnCreerSA" class="btn-secondaire">➕ Créer</button>
      </div>

      <label for="libelle">Libellé</label>
      <select id="libelle">
        <option value="seance">Séance</option>
        <option value="sequence">Séquence</option>
      </select>

      <label for="numero">Numéro</label>
      <input type="number" id="numero" placeholder="Ex: 1">

      <label for="titre">Titre</label>
      <input type="text" id="titre" placeholder="Ex: Le présent de l'indicatif" required>

      <div style="margin-top:20px;padding-top:16px;border-top:2px solid var(--bordure);">
        <label style="font-size:16px;">📝 Contenu de la leçon</label>
        <p style="font-size:13px;color:var(--texte-gris);margin-bottom:12px;">Construis la leçon bloc par bloc (Définition, Texte, Exemple, À retenir, Astuce...).</p>

        <div id="listeBlocs"></div>

        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
                    <select id="typeNouveauBloc" style="padding:10px;border:1px solid var(--bordure);border-radius:8px;flex:1;min-width:160px;">
            <option value="resume" selected>📄 Résumé</option>
            <option value="texte">Texte</option>
            <option value="definition">Définition</option>
            <option value="regle">Règle</option>
            <option value="exemple">Exemple</option>
            <option value="a_retenir">À retenir</option>
            <option value="astuce">Astuce</option>
            <option value="attention_bloc">Attention</option>
            <option value="image">🖼️ Image</option>
            <option value="video">🎬 Vidéo (YouTube)</option>
            <option value="audio">🔊 Audio</option>
            <option value="tableau">📊 Tableau</option>
            <option value="exercice">✏️ Exercice associé</option>
            <option value="ressource">📎 Ressource (lien)</option>
          </select>
          <button type="button" id="btnAjouterBloc" class="btn-secondaire">➕ Ajouter un bloc</button>
        </div>

        <button type="button" id="btnPrevisualiser" class="btn-secondaire" style="margin-top:10px;">👁️ Prévisualiser</button>
      </div>

      <label for="statut" style="margin-top:20px;">Statut</label>
      <select id="statut">
        <option value="brouillon">Brouillon</option>
        <option value="en_attente">En attente de validation</option>
      </select>

      <label for="ordre">Ordre d'affichage</label>
      <input type="number" id="ordre" placeholder="Ex: 1" required>

      <button type="submit">➕ Ajouter</button>
      <p id="messageForm" class="message-erreur"></p>
    </form>

    <button type="button" id="btnToggleFiltres" class="btn-secondaire" style="margin-bottom:12px;">🔍 Filtres et tri</button>

    <div class="admin-filtre" id="panneauFiltres" style="display:none;">
      <label for="filtreClasse">Filtrer par classe :</label>
      <select id="filtreClasse">
        <option value="">Toutes les classes</option>
      </select>

      <label for="filtreMatiere">Filtrer par matière :</label>
      <select id="filtreMatiere">
        <option value="">Toutes les matières</option>
      </select>

      <label for="filtreSousMatiere">Filtrer par sous-matière :</label>
      <select id="filtreSousMatiere">
        <option value="">Toutes</option>
      </select>

      <label for="filtreUD">Filtrer par Unité/Dossier :</label>
      <select id="filtreUD">
        <option value="">Tous</option>
      </select>

      <label for="filtreSemaine">Filtrer par semaine :</label>
      <select id="filtreSemaine">
        <option value="">Toutes</option>
        <option value="1ère semaine">1ère semaine</option>
        <option value="2e semaine">2e semaine</option>
      </select>

      <label for="filtreSA">Filtrer par SA :</label>
      <select id="filtreSA">
        <option value="">Toutes</option>
      </select>

      <label for="filtreStatut">Filtrer par statut :</label>
      <select id="filtreStatut">
        <option value="">Tous statuts</option>
        <option value="brouillon">Brouillon</option>
        <option value="en_attente">En attente</option>
        <option value="publie">Publié</option>
      </select>

      <label for="tri">Trier par :</label>
      <select id="tri">
        <option value="ordre">Ordre d'affichage</option>
        <option value="date_desc">Date (plus récent)</option>
        <option value="date_asc">Date (plus ancien)</option>
        <option value="admin">Administrateur</option>
        <option value="statut">Statut</option>
      </select>

      <label for="affichagePrincipal">Afficher en premier :</label>
      <select id="affichagePrincipal">
        <option value="titre">Titre</option>
        <option value="numero">Numéro (Séance/Séquence)</option>
        <option value="matiere">Matière</option>
      </select>
    </div>

    <div id="listeSeances" class="admin-liste">Chargement...</div>

  </main>

  <div id="modalPrevisualisation" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:500;overflow-y:auto;">
    <div style="background:white;max-width:700px;margin:20px auto;border-radius:12px;padding:20px;position:relative;">
      <button type="button" id="btnFermerPreview" style="position:absolute;top:12px;right:12px;background:none;border:none;font-size:24px;cursor:pointer;">✕</button>
      <div id="contenuPreview"></div>
    </div>
  </div>

  <button id="btnRetourHaut" style="position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--bleu-principal);color:white;border:none;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:none;cursor:pointer;z-index:200;">↑</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
  <script src="../../js/pages/editeur-blocs.js"></script>
  <script src="../../js/pages/admin-seances.js?v=9"></script>

</body>
</html>
