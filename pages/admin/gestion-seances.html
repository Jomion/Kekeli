<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des séances - KEKELI</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

  <header class="admin-header">
    <h1>Séances</h1>
    <a href="dashboard.html" class="btn-deconnexion">← Retour</a>
  </header>

  <main class="admin-contenu">

    <form id="formAjout" class="admin-form admin-form-inline">
      <label for="classe">Classe(s) — Ctrl/Cmd + clic pour plusieurs</label>
      <select id="classe" multiple size="6" required></select>

      <label for="matiere">Matière</label>
      <div style="display:flex;gap:8px;">
        <select id="matiere" required style="flex:1;">
          <option value="">-- Choisir d'abord une/des classe(s) --</option>
        </select>
        <button type="button" id="btnCreerMatiere" class="btn-secondaire">➕ Créer</button>
      </div>

      <label for="sousMatiere">Sous-matière (si applicable)</label>
      <div style="display:flex;gap:8px;">
        <select id="sousMatiere" style="flex:1;">
          <option value="">-- Aucune / non applicable --</option>
        </select>
        <button type="button" id="btnCreerSousMatiere" class="btn-secondaire">➕ Créer</button>
      </div>

      <label for="uniteDossier">Unité / Dossier (si applicable)</label>
      <div style="display:flex;gap:8px;">
        <select id="uniteDossier" style="flex:1;">
          <option value="">-- Aucun --</option>
        </select>
        <button type="button" id="btnCreerUD" class="btn-secondaire">➕ Créer</button>
      </div>

      <label for="sa">SA (si applicable)</label>
      <div style="display:flex;gap:8px;">
        <select id="sa" style="flex:1;">
          <option value="">-- Aucune / rattacher directement --</option>
        </select>
        <button type="button" id="btnCreerSA" class="btn-secondaire">➕ Créer</button>
      </div>

      <label for="libelle">Libellé</label>
      <select id="libelle">
        <option value="seance">Séance</option>
        <option value="sequence">Séquence</option>
      </select>

      <label for="numero">Numéro</label>
      <input type="number" id="numero" placeholder="Ex: 1">

      <label for="titre">Titre</label>
      <input type="text" id="titre" placeholder="Ex: Le présent de l'indicatif" required>

      <label for="objectif">Objectif</label>
      <textarea id="objectif" rows="2"></textarea>

      <label for="competence">Compétence</label>
      <textarea id="competence" rows="2"></textarea>

      <label for="prerequis">Prérequis</label>
      <textarea id="prerequis" rows="2"></textarea>

      <label for="introduction">Introduction</label>
      <textarea id="introduction" rows="3"></textarea>

      <label for="contenu">Contenu de la leçon</label>
      <textarea id="contenu" rows="6"></textarea>

      <label for="exemples">Exemples</label>
      <textarea id="exemples" rows="3"></textarea>

      <label for="resume">Résumé</label>
      <textarea id="resume" rows="3"></textarea>

      <label for="aRetenir">À retenir</label>
      <textarea id="aRetenir" rows="2"></textarea>

      <label for="attention">Attention</label>
      <textarea id="attention" rows="2"></textarea>

      <label for="avertissement">Avertissement</label>
      <textarea id="avertissement" rows="2"></textarea>

      <label for="statut">Statut</label>
      <select id="statut">
        <option value="brouillon">Brouillon</option>
        <option value="en_attente">En attente de validation</option>
      </select>

      <label for="ordre">Ordre d'affichage</label>
      <input type="number" id="ordre" placeholder="Ex: 1" required>

      <button type="submit">➕ Ajouter</button>
      <p id="messageForm" class="message-erreur"></p>
    </form>

    <button type="button" id="btnToggleFiltres" class="btn-secondaire" style="margin-bottom:12px;">🔍 Filtres et tri</button>

    <div class="admin-filtre" id="panneauFiltres" style="display:none;">
      <label for="filtreClasse">Filtrer par classe :</label>      <select id="filtreClasse">
        <option value="">Toutes les classes</option>
      </select>

      <label for="filtreMatiere">Filtrer par matière :</label>
      <select id="filtreMatiere">
        <option value="">Toutes les matières</option>
      </select>

      <label for="filtreSousMatiere">Filtrer par sous-matière :</label>
      <select id="filtreSousMatiere">
        <option value="">Toutes</option>
      </select>

      <label for="filtreSA">Filtrer par SA :</label>
      <select id="filtreSA">
        <option value="">Toutes</option>
      </select>

      <label for="filtreStatut">Filtrer par statut :</label>
      <select id="filtreStatut">
        <option value="">Tous statuts</option>
        <option value="brouillon">Brouillon</option>
        <option value="en_attente">En attente</option>
        <option value="publie">Publié</option>
      </select>

      <label for="tri">Trier par :</label>
      <select id="tri">
        <option value="ordre">Ordre d'affichage</option>
        <option value="date_desc">Date (plus récent)</option>
        <option value="date_asc">Date (plus ancien)</option>
        <option value="admin">Administrateur</option>
        <option value="statut">Statut</option>
      </select>

      <label for="affichagePrincipal">Afficher en premier :</label>
      <select id="affichagePrincipal">
        <option value="titre">Titre</option>
        <option value="numero">Numéro (Séance/Séquence)</option>
        <option value="matiere">Matière</option>
      </select>
    </div>

    <div id="listeSeances" class="admin-liste">Chargement...</div>

  </main>

  <button id="btnRetourHaut" style="position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--bleu-principal);color:white;border:none;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:none;cursor:pointer;z-index:200;">↑</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/admin-seances.js?v=4"></script>

</body>
</html>
