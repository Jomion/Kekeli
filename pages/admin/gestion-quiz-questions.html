<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questions du quiz - KEKELI</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

  <header class="admin-header">
    <h1 id="titreQuiz">Questions du quiz</h1>
    <a href="gestion-quiz.html" class="btn-deconnexion">← Retour</a>
  </header>

  <main class="admin-contenu">

    <section>
      <h2>Questions actuelles</h2>
      <div id="listeQuestionsActuelles" class="admin-liste">Chargement...</div>
    </section>

    <section style="margin-top:32px;">
      <h2>Ajouter une question</h2>

      <div class="admin-form admin-form-inline">
        <label for="filtreMatiere">Filtrer les exercices par matière (facultatif)</label>
        <select id="filtreMatiere">
          <option value="">-- Toutes matières de la classe --</option>
        </select>

        <label for="filtreType">Filtrer par type (facultatif)</label>
        <select id="filtreType">
          <option value="">-- Tous types --</option>
          <option value="qcm">QCM</option>
          <option value="vrai_faux">Vrai/Faux</option>
          <option value="reponse_saisie">Réponse à saisir</option>
          <option value="calcul">Calcul</option>
          <option value="texte_a_completer">Texte à compléter</option>
          <option value="association">Association</option>
          <option value="classement">Classement</option>
        </select>
      </div>

      <div id="listeExercicesDisponibles" class="admin-liste" style="margin-top:16px;">Chargement...</div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/admin-quiz-questions.js"></script>

</body>
</html>
