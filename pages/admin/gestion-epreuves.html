<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des épreuves - KEKELI</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

  <header class="admin-header">
    <h1>Épreuves</h1>
    <a href="dashboard.html" class="btn-deconnexion">← Retour</a>
  </header>

  <main class="admin-contenu">

    <form id="formAjout" class="admin-form admin-form-inline">
      <label for="classe">Classe(s) — Ctrl/Cmd + clic pour plusieurs</label>
      <select id="classe" multiple size="6" required></select>

      <label for="matiere">Matière</label>
      <select id="matiere" required>
        <option value="">-- Choisir d'abord une/des classe(s) --</option>
      </select>

      <label for="titre">Titre</label>
      <input type="text" id="titre" placeholder="Ex: Composition 2e trimestre" required>

      <label for="trimestre">Trimestre</label>
      <select id="trimestre" required>
        <option value="1er trimestre">1er trimestre</option>
        <option value="2e trimestre">2e trimestre</option>
        <option value="3e trimestre">3e trimestre</option>
      </select>

      <label for="anneeScolaire">Année scolaire</label>
      <input type="text" id="anneeScolaire" placeholder="Ex: 2025-2026" required>

      <label for="typeEpreuve">Type d'épreuve</label>
      <input type="text" id="typeEpreuve" placeholder="Ex: Composition, Devoir surveillé...">

      <label for="typeRealisation">Réalisation</label>
      <select id="typeRealisation" required>
        <option value="pdf">PDF uniquement</option>
        <option value="en_ligne">En ligne uniquement</option>
        <option value="les_deux">Les deux</option>
      </select>

      <label for="fichierPdfUrl">Lien du PDF (si applicable)</label>
      <input type="url" id="fichierPdfUrl" placeholder="https://...">

      <label for="correctionPdfUrl">Lien du corrigé PDF (si applicable)</label>
      <input type="url" id="correctionPdfUrl" placeholder="https://...">

      <label for="statut">Statut</label>
      <select id="statut">
        <option value="brouillon">Brouillon</option>
        <option value="en_attente">En attente de validation</option>
      </select>

      <button type="submit">➕ Ajouter</button>
      <p id="messageForm" class="message-erreur"></p>
    </form>

    <button type="button" id="btnToggleFiltres" class="btn-secondaire" style="margin-bottom:12px;">🔍 Filtres et tri</button>

    <div class="admin-filtre" id="panneauFiltres" style="display:none;">
      <label for="filtreClasse">Filtrer par classe :</label>
      <select id="filtreClasse">
        <option value="">Toutes les classes</option>
      </select>

      <label for="filtreMatiere">Filtrer par matière :</label>
      <select id="filtreMatiere">
        <option value="">Toutes les matières</option>
      </select>

      <label for="filtreTrimestre">Filtrer par trimestre :</label>
      <select id="filtreTrimestre">
        <option value="">Tous</option>
        <option value="1er trimestre">1er trimestre</option>
        <option value="2e trimestre">2e trimestre</option>
        <option value="3e trimestre">3e trimestre</option>
      </select>

      <label for="filtreStatut">Filtrer par statut :</label>
      <select id="filtreStatut">
        <option value="">Tous statuts</option>
        <option value="brouillon">Brouillon</option>
        <option value="en_attente">En attente</option>
        <option value="publie">Publié</option>
      </select>

      <label for="tri">Trier par :</label>
      <select id="tri">
        <option value="date_desc">Date (plus récent)</option>
        <option value="date_asc">Date (plus ancien)</option>
        <option value="admin">Administrateur</option>
        <option value="statut">Statut</option>
      </select>
    </div>

    <div id="listeEpreuves" class="admin-liste">Chargement...</div>

  </main>

  <button id="btnRetourHaut" style="position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--bleu-principal);color:white;border:none;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:none;cursor:pointer;z-index:200;">↑</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/admin-epreuves.js?v=2"></script>

</body>
</html>
