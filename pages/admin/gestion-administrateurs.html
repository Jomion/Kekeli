<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des administrateurs - KEKELI</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

  <header class="admin-header">
    <h1>Administrateurs</h1>
    <a href="dashboard.html" class="btn-deconnexion">← Retour</a>
  </header>

  <main class="admin-contenu">

    <div id="zoneAccesRefuse" style="display:none; padding:20px; text-align:center; color:#dc2626;">
      Accès réservé au super administrateur.
    </div>

    <div id="zoneContenu" style="display:none;">

      <div class="admin-form" style="max-width:none; margin-bottom:24px; background:var(--bleu-clair); border-color:var(--bleu-principal);">
        <p style="font-size:14px; line-height:1.6;">
          <strong>Pour ajouter un nouvel administrateur :</strong><br>
          1. Va dans Supabase → Authentication → Users → Add user (crée son compte email/mot de passe)<br>
          2. Copie son UID<br>
          3. Colle-le ci-dessous avec ses infos et permissions
        </p>
      </div>

      <form id="formAjout" class="admin-form admin-form-inline">
        <label for="uid">UID du compte (depuis Supabase Auth)</label>
        <input type="text" id="uid" placeholder="ex: 28445739-cc41-..." required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="nom">Nom</label>
        <input type="text" id="nom" required>

        <label for="role">Rôle</label>
        <select id="role" required>
          <option value="admin">Administrateur</option>
          <option value="super_admin">Super administrateur</option>
        </select>

        <label class="checkbox-label">
          <input type="checkbox" id="lectureSeule">
          Lecture seule (ne peut pas modifier/supprimer)
        </label>

        <label for="controleur">Contrôleur (valide ses publications) — vide = lui-même</label>
        <select id="controleur">
          <option value="">-- Lui-même --</option>
        </select>
        <label for="classesAutorisees">Classes autorisées (Ctrl/Cmd + clic pour plusieurs, aucune = toutes)</label>
        <select id="classesAutorisees" multiple size="6"></select>

        <label for="matieresAutorisees">Matières autorisées (aucune = toutes)</label>
        <select id="matieresAutorisees" multiple size="6"></select>

        <label for="typesAutorises">Types de contenu autorisés (aucun = tous)</label>
        <select id="typesAutorises" multiple size="5">
          <option value="seances">Séances</option>
          <option value="exercices">Exercices</option>
          <option value="quiz">Quiz</option>
          <option value="epreuves">Épreuves</option>
          <option value="ressources">Ressources</option>
        </select>

        <label class="checkbox-label">
          <input type="checkbox" id="actif" checked>
          Compte actif
        </label>

        <button type="submit">➕ Ajouter</button>
        <p id="messageForm" class="message-erreur"></p>
      </form>

      <div id="listeAdmins" class="admin-liste">Chargement...</div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/admin-administrateurs.js"></script>

</body>
</html>
